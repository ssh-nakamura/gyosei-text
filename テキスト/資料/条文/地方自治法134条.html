<h1>地方自治法134条</h1><div class="src-body">普通地方公共団体の議会は、この法律並びに会議規則及び委員会に関する条例に違反した議員に対し、議決により懲罰を科することができる。
2 懲罰に関し必要な事項は、会議規則中にこれを定めなければならない。</div><div class="note"><p><b>かみくだくと</b>　地方議会は、法律や会議のルールに違反した議員に対して、議決によって懲罰を科すことができます。懲罰の具体的な手続きなどは、会議規則で決めておく必要があります。なお、懲罰の種類は戒告、陳謝、出席停止、除名の4つに限られる点が試験の頻出ポイントです。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和5年 問44</span><span class="hmk o">正しい</span><span class="hnote">記述式の解説で引用</span></div></details></div>
