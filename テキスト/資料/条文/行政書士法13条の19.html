<h1>行政書士法13条の19</h1><p class="meta">解散</p><div class="src-body">（解散）行政書士法人は、次に掲げる理由によつて解散する。一定款に定める理由の発生二総社員の同意三他の行政書士法人との合併四破産手続開始の決定五解散を命ずる裁判六第十四条の二第一項第三号の規定による解散の処分七社員の欠亡
2 行政書士法人は、前項第三号の事由以外の事由により解散したときは、解散の日から二週間以内に、その旨を、主たる事務所の所在地の行政書士会を経由して、日本行政書士会連合会に届け出なければならない。</div></div>
