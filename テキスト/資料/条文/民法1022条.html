<h1>民法1022条</h1><p class="meta">遺言の撤回</p><div class="src-body">遺言者は、いつでも、遺言の方式に従って、その遺言の全部又は一部を撤回することができる。</div><div class="note"><p><b>かみくだくと</b>　遺言者は、いつでも遺言の方式に従って、遺言の全部または一部を撤回することができる。</p></div><details class="hits"><summary>過去問での出題 3件</summary><div class="hit"><span class="hid">令和5年 問35-2</span><span class="hmk x">誤り</span><span class="hnote"></span></div><div class="hit"><span class="hid">令和5年 問35-ウ</span><span class="hmk o">正しい</span><span class="hnote">2人以上の者が同一の証書で遺言をすることはできず、夫婦にも例外はない(民法975条)</span></div><div class="hit"><span class="hid">令和5年 問35-オ</span><span class="hmk x">誤り</span><span class="hnote">民法1022条により、遺言は方式を問わずいつでも後の遺言によって撤回することができる</span></div></details></div>
