<h1>刑法16条</h1><p class="meta">拘留</p><div class="src-body">（拘留）拘留は、一日以上三十日未満とし、刑事施設に拘置する。２拘留に処せられた者には、改善更生を図るため、必要な作業を行わせ、又は必要な指導を行うことができる。</div><div class="note"><p><b>かみくだくと</b>　拘留は1日以上30日未満の期間、刑事施設に拘置する刑です。改善更生のため必要な作業や指導を行わせることができます。</p></div></div>
