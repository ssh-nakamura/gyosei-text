<h1>商法15条</h1><p class="meta">商号の譲渡</p><div class="src-body">商人の商号は、営業とともにする場合又は営業を廃止する場合に限り、譲渡することができる。
2 前項の規定による商号の譲渡は、登記をしなければ、第三者に対抗することができない。</div><div class="note"><p><b>かみくだくと</b>　商号は、営業を丸ごと譲り渡すか、営業をやめる時に限り、他人に譲ることができます。また、この譲渡を第三者に主張するためには、登記を済ませておく必要があります。商号単独での譲渡は認められない点が試験の狙い目です。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和4年 問36-1</span><span class="hmk x">誤り</span><span class="hnote">商法15条2項の商号譲渡の登記は対抗要件で、譲渡自体は当事者の合意で効力を生じる</span></div></details></div>
