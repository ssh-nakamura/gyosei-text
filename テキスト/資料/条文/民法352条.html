<h1>民法352条</h1><p class="meta">動産質の対抗要件</p><div class="src-body">動産質権者は、継続して質物を占有しなければ、その質権をもって第三者に対抗することができない。</div><div class="note"><p><b>かみくだくと</b>　動産質権者は、質物を継続して占有していなければ、質権を第三者に主張できない。</p></div><details class="hits"><summary>過去問での出題 2件</summary><div class="hit"><span class="hid">令和元年 問31-2</span><span class="hmk o">正しい</span><span class="hnote">不動産質は引渡しで効力を生じ登記が対抗要件だが、動産質は継続して占有することが対抗要件(民法344条)</span></div><div class="hit"><span class="hid">令和2年 問28-エ</span><span class="hmk o">正しい</span><span class="hnote">質権は民法344条の引渡しを要し、同法345条が設定者による代理占有を禁じるため占有改定では成立しない</span></div></details></div>
