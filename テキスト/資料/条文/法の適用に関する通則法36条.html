<h1>法の適用に関する通則法36条</h1><p class="meta">相続</p><div class="src-body">（相続）相続は、被相続人の本国法による。</div><div class="note"><p><b>かみくだくと</b>　相続は被相続人の本国法によると定める。準拠法を被相続人の国籍の属する国の法とすることだけを内容とし、要件や例外を置かない一文の規定。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">平成30年 問2-オ</span><span class="hmk o">正しい</span><span class="hnote">国際私法(法の適用に関する通則法7条・36条など)が指定し渉外的法律関係を規律する法が準拠法</span></div></details></div>
