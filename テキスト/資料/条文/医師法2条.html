<h1>医師法2条</h1><div class="src-body">医師になろうとする者は、医師国家試験に合格し、厚生労働大臣の免許を受けなければならない。</div><div class="note"><p><b>かみくだくと</b>　医師になろうとする者は、医師国家試験に合格し、厚生労働大臣の免許を受けなければならないと定める。試験の合格と大臣の免許の2つを医師となるための要件とする一文の規定。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和6年 問50-イ</span><span class="hmk x">誤り</span><span class="hnote">特定技能一号は介護・建設・農業・外食などが対象で、医師は在留資格の医療によることになる</span></div></details></div>
