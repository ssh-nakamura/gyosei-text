<h1>民法818条</h1><p class="meta">親権</p><div class="src-body">（親権）親権は、成年に達しない子について、その子の利益のために行使しなければならない。２父母の婚姻中はその双方を親権者とする。３子が養子であるときは、次に掲げる者を親権者とする。一養親（当該子を養子とする縁組が二以上あるときは、直近の縁組により養親となった者に限る。）二子の父母であって、前号に掲げる養親の配偶者であるもの</div><div class="note"><p><b>かみくだくと</b>　成年に達しない子は父母の親権に服し、父母の婚姻中は父母双方を親権者とします。養子については養親の親権に服します。</p></div></div>
