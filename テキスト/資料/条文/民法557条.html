<h1>民法557条</h1><p class="meta">手付</p><div class="src-body">（手付）買主が売主に手付を交付したときは、買主はその手付を放棄し、売主はその倍額を現実に提供して、契約の解除をすることができる。ただし、その相手方が契約の履行に着手した後は、この限りでない。２第五百四十五条第四項の規定は、前項の場合には、適用しない。</div><div class="note"><p><b>かみくだくと</b>　手付交付後、相手方の履行着手前であれば、買主は手付放棄、売主は倍額の現実の提供により解除できます。</p></div></div>
