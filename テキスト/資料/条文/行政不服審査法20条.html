<h1>行政不服審査法20条</h1><p class="meta">口頭による審査請求</p><div class="src-body">（口頭による審査請求）口頭で審査請求をする場合には、前条第二項から第五項までに規定する事項を陳述しなければならない。この場合において、陳述を受けた行政庁は、その陳述の内容を録取し、これを陳述人に読み聞かせて誤りのないことを確認しなければならない。</div><div class="note"><p><b>かみくだくと</b>　他の法律や条例が口頭でよいと定めている場合の手続を決めた規定。口頭で審査請求をするときは、審査請求書に書くべき事項を口で述べ、聞いた行政庁がその内容を書き取って、本人に読み聞かせて誤りがないことを確かめる。</p></div></div>
