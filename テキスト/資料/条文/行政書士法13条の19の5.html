<h1>行政書士法13条の19の5</h1><p class="meta">検査役の選任</p><div class="src-body">（検査役の選任）裁判所は、行政書士法人の解散及び清算の監督に必要な調査をさせるため、検査役を選任することができる。
2 前項の検査役の選任の裁判に対しては、不服を申し立てることができない。
3 裁判所は、第一項の検査役を選任した場合には、行政書士法人が当該検査役に対して支払う報酬の額を定めることができる。この場合においては、裁判所は、当該行政書士法人及び検査役の陳述を聴かなければならない。</div></div>
