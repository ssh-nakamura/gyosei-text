<h1>憲法71条</h1><div class="src-body">前二条の場合には、内閣は、あらたに内閣総理大臣が任命されるまで引き続きその職務を行ふ。</div><div class="note"><p><b>かみくだくと</b>　69条や70条で総辞職した内閣も、新しい内閣総理大臣が任命されるまでは引き続き職務を行う。行政に空白が生じるのを防ぐための規定で、いわゆる職務執行内閣の根拠になる。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和4年 問6-4</span><span class="hmk o">正しい</span><span class="hnote">解説が根拠として引いている</span></div></details></div>
