<h1>民法579条</h1><p class="meta">買戻しの特約</p><div class="src-body">（買戻しの特約）不動産の売主は、売買契約と同時にした買戻しの特約により、買主が支払った代金（別段の合意をした場合にあっては、その合意により定めた金額。第五百八十三条第一項において同じ。）及び契約の費用を返還して、売買の解除をすることができる。この場合において、当事者が別段の意思を表示しなかったときは、不動産の果実と代金の利息とは相殺したものとみなす。</div><div class="note"><p><b>かみくだくと</b>　不動産売主は売買と同時の買戻特約により、代金と契約費用を返還して売買を解除できます。</p></div></div>
