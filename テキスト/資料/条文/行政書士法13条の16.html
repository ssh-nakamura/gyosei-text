<h1>行政書士法13条の16</h1><p class="meta">社員の競業の禁止</p><div class="src-body">（社員の競業の禁止）行政書士法人の社員は、自己若しくは第三者のためにその行政書士法人の業務の範囲に属する業務を行い、又は他の行政書士法人の社員となつてはならない。
2 行政書士法人の社員が前項の規定に違反して自己又は第三者のためにその行政書士法人の業務の範囲に属する業務を行つたときは、当該業務によつて当該社員又は第三者が得た利益の額は、行政書士法人に生じた損害の額と推定する。</div></div>
