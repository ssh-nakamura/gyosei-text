<h1>民法424条の8</h1><p class="meta">詐害行為の取消しの範囲</p><div class="src-body">（詐害行為の取消しの範囲）債権者は、詐害行為取消請求をする場合において、債務者がした行為の目的が可分であるときは、自己の債権の額の限度においてのみ、その行為の取消しを請求することができる。２債権者が第四百二十四条の六第一項後段又は第二項後段の規定により価額の償還を請求する場合についても、前項と同様とする。</div></div>
