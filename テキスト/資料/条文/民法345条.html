<h1>民法345条</h1><p class="meta">質権設定者による代理占有の禁止</p><div class="src-body">（質権設定者による代理占有の禁止）質権者は、質権設定者に、自己に代わって質物の占有をさせることができない。</div><div class="note"><p><b>かみくだくと</b>　質権を設定した人（持ち主）に、質権者の代わりにその物を預けさせることはできません。質権は物を占有し続けることが効力の要件であるため、持ち主が手元に置く状態を認めてしまうと、質権の効力が失われてしまうからです。</p></div><details class="hits"><summary>過去問での出題 2件</summary><div class="hit"><span class="hid">令和2年 問28-5</span><span class="hmk x">誤り</span><span class="hnote"></span></div><div class="hit"><span class="hid">令和2年 問28-エ</span><span class="hmk o">正しい</span><span class="hnote">質権は民法344条の引渡しを要し、同法345条が設定者による代理占有を禁じるため占有改定では成立しない</span></div></details></div>
