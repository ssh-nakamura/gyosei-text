<h1>憲法55条</h1><div class="src-body">両議院は、各々その議員の資格に関する争訟を裁判する。但し、議員の議席を失はせるには、出席議員の三分の二以上の多数による議決を必要とする。</div><div class="note"><p><b>かみくだくと</b>　議員に議員としての資格があるかどうかの争いは、各議院が自ら裁判する。議席を失わせるには出席議員の3分の2以上の議決が必要。議院の自律権に属する事柄なので、裁判所に訴えて争うことはできない点が要点。</p></div><details class="hits"><summary>過去問での出題 2件</summary><div class="hit"><span class="hid">令和4年 問41</span><span class="hmk o">正しい</span><span class="hnote">多肢選択式の解説で引用</span></div><div class="hit"><span class="hid">令和5年 問5-2</span><span class="hmk x">誤り</span><span class="hnote">各議院が自律的に行う資格争訟の裁判を、両院から選出された国会議員による裁判にすり替えている</span></div></details></div>
