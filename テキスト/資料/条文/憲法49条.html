<h1>憲法49条</h1><div class="src-body">両議院の議員は、法律の定めるところにより、国庫から相当額の歳費を受ける。</div><div class="note"><p><b>かみくだくと</b>　国会議員は法律の定めるところにより国庫から相当額の歳費を受ける。裁判官の報酬が在任中減額できないと明記されている(79条・80条)のに対し、議員の歳費には減額禁止の規定がなく、法律で減額できる点が対比で問われる。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和6年 問7-1</span><span class="hmk x">誤り</span><span class="hnote">解説が根拠として引いている</span></div></details></div>
