<h1>民法970条</h1><p class="meta">秘密証書遺言</p><div class="src-body">（秘密証書遺言）秘密証書によって遺言をするには、次に掲げる方式に従わなければならない。一遺言者が、その証書に署名し、印を押すこと。二遺言者が、その証書を封じ、証書に用いた印章をもってこれに封印すること。三遺言者が、公証人一人及び証人二人以上の前に封書を提出して、自己の遺言書である旨並びにその筆者の氏名及び住所を申述すること。四公証人が、その証書を提出した日付及び遺言者の申述を封紙に記載した後、遺言者及び証人とともにこれに署名し、印を押すこと。２第九百六十八条第三項の規定は、秘密証書による遺言について準用する。</div></div>
