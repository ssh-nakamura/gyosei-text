<h1>民法587条</h1><p class="meta">消費貸借</p><div class="src-body">（消費貸借）消費貸借は、当事者の一方が種類、品質及び数量の同じ物をもって返還をすることを約して相手方から金銭その他の物を受け取ることによって、その効力を生ずる。</div><div class="note"><p><b>かみくだくと</b>　消費貸借は、種類・品質・数量が同じ物を返還する約束で相手方から金銭その他の物を受け取ることにより効力を生じます。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和4年 問2-オ</span><span class="hmk o">正しい</span><span class="hnote">要件事実とは法律要件に該当する具体的事実をいい、民事訴訟における主張立証責任の対象となる</span></div></details></div>
