.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%}

<h1>会社法458条</h1><p class="meta">適用除外</p><div class="src-body">第四百五十三条から前条までの規定は、株式会社の純資産額が三百万円を下回る場合には、適用しない。</div><div class="note"><p><b>かみくだくと</b>　純資産額が300万円を下回る会社は剰余金の配当をすることができない。会社法が最低資本金制度を廃止して資本金1円でも会社を作れるようにした代わりに、債権者保護の最低ラインとして設けられた歯止めで、300万円という数字がそのまま問われる。</p></div><details class="hits"><summary>過去問での出題 2件</summary><div class="hit"><span class="hid">令和3年 問40-1</span><span class="hmk o">正しい</span><span class="hnote"></span></div><div class="hit"><span class="hid">令和3年 問40-ウ</span><span class="hmk o">正しい</span><span class="hnote">会社法458条により、純資産額が三百万円を下回る場合には剰余金の配当をすることができない</span></div></details></div>
