<h1>不動産登記法109条</h1><p class="meta">仮登記に基づく本登記</p><div class="src-body">（仮登記に基づく本登記）所有権に関する仮登記に基づく本登記は、登記上の利害関係を有する第三者（本登記につき利害関係を有する抵当証券の所持人又は裏書人を含む。以下この条において同じ。）がある場合には、当該第三者の承諾があるときに限り、申請することができる。２登記官は、前項の規定による申請に基づいて登記をするときは、職権で、同項の第三者の権利に関する登記を抹消しなければならない。</div></div>
