<h1>民法522条</h1><p class="meta">契約の成立と方式</p><div class="src-body">（契約の成立と方式）契約は、契約の内容を示してその締結を申し入れる意思表示（以下「申込み」という。）に対して相手方が承諾をしたときに成立する。２契約の成立には、法令に特別の定めがある場合を除き、書面の作成その他の方式を具備することを要しない。</div><div class="note"><p><b>かみくだくと</b>　契約は申込みに対して相手方が承諾したときに成立し、法令に特別の定めがなければ書面その他の方式を必要としません。</p></div></div>
