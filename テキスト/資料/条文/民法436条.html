<h1>民法436条</h1><p class="meta">連帯債務者に対する履行の請求</p><div class="src-body">（連帯債務者に対する履行の請求）債務の目的がその性質上可分である場合において、法令の規定又は当事者の意思表示によって数人が連帯して債務を負担するときは、債権者は、その連帯債務者の一人に対し、又は同時に若しくは順次に全ての連帯債務者に対し、全部又は一部の履行を請求することができる。</div></div>
