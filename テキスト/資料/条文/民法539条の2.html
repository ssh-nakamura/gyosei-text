<h1>民法539条の2</h1><div class="src-body">契約の当事者の一方が第三者との間で契約上の地位を譲渡する旨の合意をした場合において、その契約の相手方がその譲渡を承諾したときは、契約上の地位は、その第三者に移転する。</div><div class="note"><p><b>かみくだくと</b>　契約上の地位は譲渡人・譲受人の合意と契約相手方の承諾により移転します。</p></div></div>
