<h1>ヒトに関するクローン技術等の規制に関する法律3条</h1><p class="meta">禁止行為</p><div class="src-body">（禁止行為）何人も、人クローン胚、ヒト動物交雑胚、ヒト性融合胚又はヒト性集合胚を人又は動物の胎内に移植してはならない。</div><div class="note"><p><b>かみくだくと</b>　何人も、人クローン胚、ヒト動物交雑胚、ヒト性融合胚またはヒト性集合胚を人または動物の胎内に移植してはならないと定める。4種類の胚について移植を禁じる規定。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">平成30年 問4-2</span><span class="hmk x">誤り</span><span class="hnote">ヒトに関するクローン技術等の規制に関する法律3条は胎内移植を禁じ、16条に罰則があり研究規制の実例となる</span></div></details></div>
