<h1>行政書士法4条の7</h1><p class="meta">指定試験機関の役員等の秘密を守る義務等</p><div class="src-body">（指定試験機関の役員等の秘密を守る義務等）指定試験機関の役員若しくは職員（試験委員を含む。第三項において同じ。）又はこれらの職にあつた者は、試験事務に関して知り得た秘密を漏らしてはならない。
2 試験委員は、試験の問題の作成及び採点について、厳正を保持し不正の行為のないようにしなければならない。
3 試験事務に従事する指定試験機関の役員及び職員は、刑法（明治四十年法律第四十五号）その他の罰則の適用については、法令により公務に従事する職員とみなす。</div></div>
