<h1>民法672条</h1><p class="meta">業務執行組合員の辞任及び解任</p><div class="src-body">組合契約の定めるところにより一人又は数人の組合員に業務の決定及び執行を委任したときは、その組合員は、正当な事由がなければ、辞任することができない。
2 前項の組合員は、正当な事由がある場合に限り、他の組合員の一致によって解任することができる。</div><div class="note"><p><b>かみくだくと</b>　業務の決定・執行を委任された組合員は、正当な事由がなければ辞任できず、正当な事由がある場合に他の組合員全員の一致によって解任できる。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和6年 問33-5</span><span class="hmk o">正しい</span><span class="hnote">解説が根拠として引いている</span></div></details></div>
