<h1>民法1012条</h1><p class="meta">遺言執行者の権利義務</p><div class="src-body">（遺言執行者の権利義務）遺言執行者は、遺言の内容を実現するため、相続財産の管理その他遺言の執行に必要な一切の行為をする権利義務を有する。２遺言執行者がある場合には、遺贈の履行は、遺言執行者のみが行うことができる。３第六百四十四条、第六百四十五条から第六百四十七条まで及び第六百五十条の規定は、遺言執行者について準用する。</div><div class="note"><p><b>かみくだくと</b>　遺言執行者は遺言実現に必要な一切の行為をする権利義務を持ち、遺言執行者がいる場合の遺贈履行は遺言執行者だけが行います。</p></div></div>
