<h1>行政代執行法4条</h1><div class="src-body">代執行のために現場に派遣される執行責任者は、その者が執行責任者たる本人であることを示すべき証票を携帯し、要求があるときは、何時でもこれを呈示しなければならない。</div><div class="note"><p><b>かみくだくと</b>　代執行のために現場に派遣される執行責任者は、執行責任者本人であることを示す証票を携帯し、要求があるときは何時でもこれを呈示しなければならないと定める。現場に来た者が正当な権限を持つのかを相手方が確かめられるようにするための規定で、3条2項が代執行令書で執行責任者の氏名を通知させるのと対になっている。</p></div></div>
