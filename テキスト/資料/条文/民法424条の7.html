<h1>民法424条の7</h1><p class="meta">被告及び訴訟告知</p><div class="src-body">（被告及び訴訟告知）詐害行為取消請求に係る訴えについては、次の各号に掲げる区分に応じ、それぞれ当該各号に定める者を被告とする。一受益者に対する詐害行為取消請求に係る訴え受益者二転得者に対する詐害行為取消請求に係る訴えその詐害行為取消請求の相手方である転得者２債権者は、詐害行為取消請求に係る訴えを提起したときは、遅滞なく、債務者に対し、訴訟告知をしなければならない。</div></div>
