<h1>地方自治法78条</h1><div class="src-body">普通地方公共団体の議会は、第七十六条第三項の規定による解散の投票において過半数の同意があつたときは、解散するものとする。</div><div class="note"><p><b>かみくだくと</b>　解散請求を受けた住民投票で過半数の賛成があれば、議会はその時点で解散する。改めて誰かが解散を命じる手続はいらず、投票結果だけで効果が生じる。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和5年 問23-5</span><span class="hmk x">誤り</span><span class="hnote">署名数要件の緩和特例を、解散の住民投票における過半数の同意という別の要件に持ち込んでいる</span></div></details></div>
