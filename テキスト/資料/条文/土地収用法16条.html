<h1>土地収用法16条</h1><p class="meta">事業の認定</p><div class="src-body">（事業の認定）起業者は、当該事業又は当該事業の施行により必要を生じた第三条各号の一に該当するものに関する事業（以下「関連事業」という。）のために土地を収用し、又は使用しようとするときは、この節の定めるところに従い、事業の認定を受けなければならない。</div><div class="note"><p><b>かみくだくと</b>　起業者が土地を収用または使用しようとするときは、事業の認定を受けなければならないと定める。収用の手続は、この事業の認定と、収用委員会の裁決との二段で進む。認定の要件は20条が定める。</p></div></div>
