<h1>民法962条</h1><div class="src-body">第五条、第九条、第十三条及び第十七条の規定は、遺言については、適用しない。</div><div class="note"><p><b>かみくだくと</b>　民法5条・9条・13条・17条の規定を、遺言については適用しないと定める。他の場面で働くこれらの規定を遺言の場面だけ外すことを示す、除外だけを内容とする一文の条文。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和5年 問35-ア</span><span class="hmk x">誤り</span><span class="hnote">民法973条により、成年被後見人も事理弁識能力の回復時に医師2人以上の立会いで遺言できる</span></div></details></div>
