<h1>行政書士法13条の19の3</h1><p class="meta">裁判所による監督</p><div class="src-body">（裁判所による監督）行政書士法人の解散及び清算は、裁判所の監督に属する。
2 裁判所は、職権で、いつでも前項の監督に必要な検査をすることができる。
3 行政書士法人の解散及び清算を監督する裁判所は、行政書士法人を監督する都道府県知事に対し、意見を求め、又は調査を嘱託することができる。
4 前項に規定する都道府県知事は、同項に規定する裁判所に対し、意見を述べることができる。</div></div>
