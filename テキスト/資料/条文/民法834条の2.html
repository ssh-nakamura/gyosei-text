<h1>民法834条の2</h1><p class="meta">親権停止の審判</p><div class="src-body">（親権停止の審判）父又は母による親権の行使が困難又は不適当であることにより子の利益を害するときは、家庭裁判所は、子、その親族、未成年後見人、未成年後見監督人又は検察官の請求により、その父又は母について、親権停止の審判をすることができる。２家庭裁判所は、親権停止の審判をするときは、その原因が消滅するまでに要すると見込まれる期間、子の心身の状態及び生活の状況その他一切の事情を考慮して、二年を超えない範囲内で、親権を停止する期間を定める。</div></div>
