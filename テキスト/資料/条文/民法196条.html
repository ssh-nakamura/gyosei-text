<h1>民法196条</h1><p class="meta">占有者による費用の償還請求</p><div class="src-body">（占有者による費用の償還請求）占有者が占有物を返還する場合には、その物の保存のために支出した金額その他の必要費を回復者から償還させることができる。ただし、占有者が果実を取得したときは、通常の必要費は、占有者の負担に帰する。２占有者が占有物の改良のために支出した金額その他の有益費については、その価格の増加が現存する場合に限り、回復者の選択に従い、その支出した金額又は増価額を償還させることができる。ただし、悪意の占有者に対しては、裁判所は、回復者の請求により、その償還について相当の期限を許与することができる。</div></div>
