<h1>民法728条</h1><p class="meta">離婚等による姻族関係の終了</p><div class="src-body">（離婚等による姻族関係の終了）姻族関係は、離婚によって終了する。２夫婦の一方が死亡した場合において、生存配偶者が姻族関係を終了させる意思を表示したときも、前項と同様とする。</div><div class="note"><p><b>かみくだくと</b>　姻族関係は離婚によって終わると定める。2項は夫婦の一方が死亡した場合で、生き残った配偶者が姻族関係を終了させる意思を表示したときにも、同じく姻族関係が終わるとする。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和元年 問35-ウ</span><span class="hmk o">正しい</span><span class="hnote">夫婦の一方の死亡では当然には復氏せず、生存配偶者は届出により婚姻前の氏に復せる(民法751条1項)</span></div></details></div>
