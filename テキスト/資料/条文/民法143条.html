<h1>民法143条</h1><p class="meta">暦による期間の計算</p><div class="src-body">（暦による期間の計算）週、月又は年によって期間を定めたときは、その期間は、暦に従って計算する。２週、月又は年の初めから期間を起算しないときは、その期間は、最後の週、月又は年においてその起算日に応当する日の前日に満了する。ただし、月又は年によって期間を定めた場合において、最後の月に応当する日がないときは、その月の末日に満了する。</div><div class="note"><p><b>かみくだくと</b>　週・月・年による期間は暦に従い、起算日に応当する日の前日に満了し、応当日がないときは月末に満了します。</p></div></div>
