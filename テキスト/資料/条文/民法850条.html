<h1>民法850条</h1><p class="meta">後見監督人の欠格事由</p><div class="src-body">後見人の配偶者、直系血族及び兄弟姉妹は、後見監督人となることができない。</div><div class="note"><p><b>かみくだくと</b>　後見人の配偶者・直系血族・兄弟姉妹は、その後見人を監督する後見監督人になることができない。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">平成30年 問35-5</span><span class="hmk o">正しい</span><span class="hnote">後見人の配偶者・直系血族・兄弟姉妹は後見監督人になれない(850条)</span></div></details></div>
