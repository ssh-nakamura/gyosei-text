<h1>公職選挙法258条</h1><p class="meta">地方公共団体の議会の議員の任期の起算</p><div class="src-body">（地方公共団体の議会の議員の任期の起算）地方公共団体の議会の議員の任期は、一般選挙の日から起算する。但し、任期満了に因る一般選挙が地方公共団体の議会の議員の任期満了の日前に行われた場合において、前任の議員が任期満了の日まで在任したときは前任者の任期満了の日の翌日から、選挙の期日後に前任の議員がすべてなくなつたときは議員がすべてなくなつた日の翌日から、それぞれ起算する。</div></div>
