<h1>民法878条</h1><p class="meta">扶養の順位</p><div class="src-body">（扶養の順位）扶養をする義務のある者が数人ある場合において、扶養をすべき者の順序について、当事者間に協議が調わないとき、又は協議をすることができないときは、家庭裁判所が、これを定める。扶養を受ける権利のある者が数人ある場合において、扶養義務者の資力がその全員を扶養するのに足りないときの扶養を受けるべき者の順序についても、同様とする。</div></div>
