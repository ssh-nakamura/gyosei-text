<h1>民法555条</h1><p class="meta">売買</p><div class="src-body">（売買）売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。</div><div class="note"><p><b>かみくだくと</b>　売買を、当事者の一方が財産権を相手方に移転すると約し、相手方が代金を支払うと約することで効力を生じる契約と定める。物の引渡しや代金の授受は成立の要件とされていない。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和4年 問2-イ</span><span class="hmk o">正しい</span><span class="hnote">法律効果とは、法律要件が満たされたことにより生じる権利義務関係の発生・変更・消滅をいう</span></div></details></div>
