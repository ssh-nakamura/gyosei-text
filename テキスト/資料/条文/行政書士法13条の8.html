<h1>行政書士法13条の8</h1><p class="meta">設立の手続</p><div class="src-body">（設立の手続）行政書士法人を設立するには、その社員となろうとする行政書士が、定款を定めなければならない。
2 会社法（平成十七年法律第八十六号）第三十条第一項の規定は、行政書士法人の定款について準用する。
3 定款には、少なくとも次に掲げる事項を記載しなければならない。一目的二名称三主たる事務所及び従たる事務所の所在地四社員の氏名、住所及び特定業務を行うことを目的とする行政書士法人にあつては、当該特定業務を行うことができる行政書士である社員（以下「特定社員」という。）であるか否かの別五社員の出資に関する事項</div></div>
