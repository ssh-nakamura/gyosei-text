<h1>行政不服審査法28条</h1><p class="meta">審理手続の計画的進行</p><div class="src-body">（審理手続の計画的進行）審査請求人、参加人及び処分庁等（以下「審理関係人」という。）並びに審理員は、簡易迅速かつ公正な審理の実現のため、審理において、相互に協力するとともに、審理手続の計画的な進行を図らなければならない。</div><div class="note"><p><b>かみくだくと</b>　審査請求人・参加人・処分庁等（これらをまとめて審理関係人という）と審理員の双方に、簡易迅速かつ公正な審理を実現するため互いに協力し、審理手続を計画的に進める義務を課した規定。</p></div></div>
