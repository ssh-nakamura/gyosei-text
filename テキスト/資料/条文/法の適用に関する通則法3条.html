<h1>法の適用に関する通則法3条</h1><p class="meta">法律と同一の効力を有する慣習</p><div class="src-body">（法律と同一の効力を有する慣習）公の秩序又は善良の風俗に反しない慣習は、法令の規定により認められたもの又は法令に規定されていない事項に関するものに限り、法律と同一の効力を有する。</div><div class="note"><p><b>かみくだくと</b>　公の秩序または善良の風俗に反しない慣習は、法令の規定により認められたものか、法令に規定されていない事項に関するものに限り、法律と同一の効力を有すると定める。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">平成30年 問2-エ</span><span class="hmk x">誤り</span><span class="hnote">慣習法は制定行為によらず成立するが人為に基づく点で実定法に含まれ、社会法は法分野の総称</span></div></details></div>
