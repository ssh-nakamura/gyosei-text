<h1>民法442条</h1><p class="meta">連帯債務者間の求償権</p><div class="src-body">（連帯債務者間の求償権）連帯債務者の一人が弁済をし、その他自己の財産をもって共同の免責を得たときは、その連帯債務者は、その免責を得た額が自己の負担部分を超えるかどうかにかかわらず、他の連帯債務者に対し、その免責を得るために支出した財産の額（その財産の額が共同の免責を得た額を超える場合にあっては、その免責を得た額）のうち各自の負担部分に応じた額の求償権を有する。２前項の規定による求償は、弁済その他免責があった日以後の法定利息及び避けることができなかった費用その他の損害の賠償を包含する。</div></div>
