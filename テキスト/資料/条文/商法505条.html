<h1>商法505条</h1><p class="meta">商行為の委任</p><div class="src-body">商行為の受任者は、委任の本旨に反しない範囲内において、委任を受けていない行為をすることができる。</div><div class="note"><p><b>かみくだくと</b>　商行為を委任された者は、委任の趣旨に反しない範囲であれば、はっきり頼まれていない行為までできる。民法の委任では委任された事務の範囲に限られるのに対し、商取引では状況の変化に即応する必要があるため、受任者の権限を広げた特則になっている。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和5年 問36-2</span><span class="hmk o">正しい</span><span class="hnote">商行為の受任者は委任の本旨に反しない範囲で委任外の行為可</span></div></details></div>
