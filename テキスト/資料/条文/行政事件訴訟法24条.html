<h1>行政事件訴訟法24条</h1><p class="meta">職権証拠調べ</p><div class="src-body">裁判所は、必要があると認めるときは、職権で、証拠調べをすることができる。ただし、その証拠調べの結果について、当事者の意見をきかなければならない。</div><div class="note"><p><b>かみくだくと</b>　裁判所は必要と認めれば、当事者が申し出ていない証拠でも自分の判断で調べられる。ただし調べた結果については当事者の意見を聴かなければならない。あくまで「証拠調べ」を職権でできるだけで、当事者が主張していない事実まで裁判所が拾い上げる職権探知までは認められていない点が急所。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和元年 問19-2</span><span class="hmk x">誤り</span><span class="hnote">解説が根拠として引いている</span></div></details></div>
