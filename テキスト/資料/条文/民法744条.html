<h1>民法744条</h1><p class="meta">不適法な婚姻の取消し</p><div class="src-body">（不適法な婚姻の取消し）第七百三十一条、第七百三十二条及び第七百三十四条から第七百三十六条までの規定に違反した婚姻は、各当事者、その親族又は検察官から、その取消しを家庭裁判所に請求することができる。ただし、検察官は、当事者の一方が死亡した後は、これを請求することができない。２第七百三十二条の規定に違反した婚姻については、前婚の配偶者も、その取消しを請求することができる。</div></div>
