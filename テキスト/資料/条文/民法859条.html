<h1>民法859条</h1><p class="meta">財産の管理及び代表</p><div class="src-body">後見人は、被後見人の財産を管理し、かつ、その財産に関する法律行為について被後見人を代表する。
2 第八百二十四条ただし書の規定は、前項の場合について準用する。</div><div class="note"><p><b>かみくだくと</b>　後見人は被後見人の財産を管理し、財産に関する法律行為について被後見人を代表する。利益が相反する行為については特別代理人の選任が必要になる。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和7年 問28-ア</span><span class="hmk x">誤り</span><span class="hnote">成年後見人は民法859条により被後見人の財産に関する法律行為の包括的な代理権を持つ</span></div></details></div>
