<h1>民法246条</h1><p class="meta">加工</p><div class="src-body">（加工）他人の動産に工作を加えた者（以下この条において「加工者」という。）があるときは、その加工物の所有権は、材料の所有者に帰属する。ただし、工作によって生じた価格が材料の価格を著しく超えるときは、加工者がその加工物の所有権を取得する。２前項に規定する場合において、加工者が材料の一部を供したときは、その価格に工作によって生じた価格を加えたものが他人の材料の価格を超えるときに限り、加工者がその加工物の所有権を取得する。</div></div>
