<h1>民法508条</h1><p class="meta">時効により消滅した債権を自働債権とする相殺</p><div class="src-body">（時効により消滅した債権を自働債権とする相殺）時効によって消滅した債権がその消滅以前に相殺に適するようになっていた場合には、その債権者は、相殺をすることができる。</div><div class="note"><p><b>かみくだくと</b>　すでに時効で消滅した債権でも、消滅する前に相殺できる状態になっていたのであれば、それを自働債権として相殺することができる。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和5年 問31-2</span><span class="hmk o">正しい</span><span class="hnote">消滅以前に相殺適状にあれば時効消滅した債権でも相殺できる</span></div></details></div>
