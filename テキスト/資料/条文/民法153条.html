<h1>民法153条</h1><p class="meta">時効の完成猶予又は更新の効力が及ぶ者の範囲</p><div class="src-body">（時効の完成猶予又は更新の効力が及ぶ者の範囲）第百四十七条又は第百四十八条の規定による時効の完成猶予又は更新は、完成猶予又は更新の事由が生じた当事者及びその承継人の間においてのみ、その効力を有する。２第百四十九条から第百五十一条までの規定による時効の完成猶予は、完成猶予の事由が生じた当事者及びその承継人の間においてのみ、その効力を有する。３前条の規定による時効の更新は、更新の事由が生じた当事者及びその承継人の間においてのみ、その効力を有する。</div></div>
