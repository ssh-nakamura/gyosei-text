<h1>民法762条</h1><p class="meta">夫婦間における財産の帰属</p><div class="src-body">（夫婦間における財産の帰属）夫婦の一方が婚姻前から有する財産及び婚姻中自己の名で得た財産は、その特有財産（夫婦の一方が単独で有する財産をいう。）とする。２夫婦のいずれに属するか明らかでない財産は、その共有に属するものと推定する。</div></div>
