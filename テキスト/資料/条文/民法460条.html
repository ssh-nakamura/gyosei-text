<h1>民法460条</h1><p class="meta">委託を受けた保証人の事前の求償権</p><div class="src-body">（委託を受けた保証人の事前の求償権）保証人は、主たる債務者の委託を受けて保証をした場合において、次に掲げるときは、主たる債務者に対して、あらかじめ、求償権を行使することができる。一主たる債務者が破産手続開始の決定を受け、かつ、債権者がその破産財団の配当に加入しないとき。二債務が弁済期にあるとき。ただし、保証契約の後に債権者が主たる債務者に許与した期限は、保証人に対抗することができない。三保証人が過失なく債権者に弁済をすべき旨の裁判の言渡しを受けたとき。</div></div>
