<h1>政治資金規正法1条</h1><p class="meta">目的</p><div class="src-body">（目的）この法律は、議会制民主政治の下における政党その他の政治団体の機能の重要性及び公職の候補者の責務の重要性にかんがみ、政治団体及び公職の候補者により行われる政治活動が国民の不断の監視と批判の下に行われるようにするため、政治団体の届出、政治団体に係る政治資金の収支の公開並びに政治団体及び公職の候補者に係る政治資金の授受の規正その他の措置を講ずることにより、政治活動の公明と公正を確保し、もつて民主政治の健全な発達に寄与することを目的とする。</div></div>
