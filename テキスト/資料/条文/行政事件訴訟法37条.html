<h1>行政事件訴訟法37条</h1><p class="meta">不作為の違法確認の訴えの原告適格</p><div class="src-body">不作為の違法確認の訴えは、処分又は裁決についての申請をした者に限り、提起することができる。</div><div class="note"><p><b>かみくだくと</b>　役所が申請を放置していることの違法確認を求める訴えは、実際に申請をした人しか起こせない。申請していない第三者は、いくら利害があっても使えない。誰でも申し出られる行政手続法36条の3(処分等の求め)と混同しやすい。</p></div><details class="hits"><summary>過去問での出題 3件</summary><div class="hit"><span class="hid">令和2年 問13-2</span><span class="hmk x">誤り</span><span class="hnote"></span></div><div class="hit"><span class="hid">令和2年 問13-5</span><span class="hmk x">誤り</span><span class="hnote"></span></div><div class="hit"><span class="hid">令和4年 問17-3</span><span class="hmk x">誤り</span><span class="hnote">「法令に基づく申請」であることという要件を落として、原告適格を広げている</span></div></details></div>
