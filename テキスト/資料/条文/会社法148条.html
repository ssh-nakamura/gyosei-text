<h1>会社法148条</h1><p class="meta">株主名簿の記載等</p><div class="src-body">（株主名簿の記載等）株式に質権を設定した者は、株式会社に対し、次に掲げる事項を株主名簿に記載し、又は記録することを請求することができる。一質権者の氏名又は名称及び住所二質権の目的である株式</div><div class="note"><p><b>かみくだくと</b>　株に質権を設定した人は、会社に対して、質権者の名前や住所、対象となる株式の内容を株主名簿に載せるよう請求できます。これをしないと、会社や第三者に対して質権者であることを主張できないため、権利を守るための重要な手続きです。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和3年 問38-2</span><span class="hmk x">誤り</span><span class="hnote">解説が根拠として引いている</span></div></details></div>
