<h1>会社法453条</h1><p class="meta">株主に対する剰余金の配当</p><div class="src-body">株式会社は、その株主（当該株式会社を除く。）に対し、剰余金の配当をすることができる。</div><div class="note"><p><b>かみくだくと</b>　会社は株主に対して剰余金の配当ができるという原則を定める条文。自己株式には配当できず、配当は分配可能額の範囲内でなければならない(461条)。旧商法と違って年1回や2回といった回数の制限はなく、要件を満たす限り期中に何度でも配当できる点が特徴。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">平成30年 問40-4</span><span class="hmk x">誤り</span><span class="hnote">会社法453条は配当の相手方から当該株式会社を除いており、自己株式に剰余金の配当はできない</span></div></details></div>
