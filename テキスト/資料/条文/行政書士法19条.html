<h1>行政書士法19条</h1><p class="meta">業務の制限</p><div class="src-body">（業務の制限）行政書士又は行政書士法人でない者は、他人の依頼を受けいかなる名目によるかを問わず報酬を得て、業として第一条の三に規定する業務を行うことができない。ただし、他の法律に別段の定めがある場合及び定型的かつ容易に行えるものとして総務省令で定める手続について、当該手続に関し相当の経験又は能力を有する者として総務省令で定める者が電磁的記録を作成する場合は、この限りでない。
2 総務大臣は、前項に規定する総務省令を定めるときは、あらかじめ、当該手続に係る法令を所管する国務大臣の意見を聴くものとする。</div></div>
