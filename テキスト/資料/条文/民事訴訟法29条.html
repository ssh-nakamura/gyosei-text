<h1>民事訴訟法29条</h1><p class="meta">法人でない社団等の当事者能力</p><div class="src-body">（法人でない社団等の当事者能力）法人でない社団又は財団で代表者又は管理人の定めがあるものは、その名において訴え、又は訴えられることができる。</div><div class="note"><p><b>かみくだくと</b>　法人でない社団や財団であっても、代表者または管理人の定めがあるものは、その名において訴え、また訴えられることができると定める。団体そのものを当事者として扱う根拠となる条文。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和5年 問2-ア</span><span class="hmk x">誤り</span><span class="hnote">権利能力なき社団は法人格がなくても、民事訴訟法29条により訴訟上の当事者能力を有する</span></div></details></div>
