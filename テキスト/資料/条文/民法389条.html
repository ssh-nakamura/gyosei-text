<h1>民法389条</h1><p class="meta">抵当地の上の建物の競売</p><div class="src-body">（抵当地の上の建物の競売）抵当権の設定後に抵当地に建物が築造されたときは、抵当権者は、土地とともにその建物を競売することができる。ただし、その優先権は、土地の代価についてのみ行使することができる。２前項の規定は、その建物の所有者が抵当地を占有するについて抵当権者に対抗することができる権利を有する場合には、適用しない。</div><div class="note"><p><b>かみくだくと</b>　土地への抵当権設定後に建物が築造された場合、土地抵当権者は土地と建物を一括競売できますが、建物代価から優先弁済を受けられません。</p></div></div>
