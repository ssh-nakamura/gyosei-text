<h1>戸籍法95条</h1><div class="src-body">民法第七百五十一条第一項の規定によつて婚姻前の氏に復しようとする者は、その旨を届け出なければならない。</div><div class="note"><p><b>かみくだくと</b>　民法751条1項によって婚姻前の氏に復そうとする者は、その旨を届け出なければならないと定める。復氏という民法上の意思表示を戸籍の手続の側で受ける一文の条文である。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和元年 問35-ウ</span><span class="hmk o">正しい</span><span class="hnote">夫婦の一方の死亡では当然には復氏せず、生存配偶者は届出により婚姻前の氏に復せる(民法751条1項)</span></div></details></div>
