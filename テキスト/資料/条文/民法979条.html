<h1>民法979条</h1><p class="meta">船舶遭難者の遺言</p><div class="src-body">（船舶遭難者の遺言）船舶が遭難した場合において、当該船舶中に在って死亡の危急に迫った者は、証人二人以上の立会いをもって口頭で遺言をすることができる。２口がきけない者が前項の規定により遺言をする場合には、遺言者は、通訳人の通訳によりこれをしなければならない。３前二項の規定に従ってした遺言は、証人が、その趣旨を筆記して、これに署名し、印を押し、かつ、証人の一人又は利害関係人から遅滞なく家庭裁判所に請求してその確認を得なければ、その効力を生じない。４第九百七十六条第五項の規定は、前項の場合について準用する。</div></div>
