<h1>行政書士法16条の5</h1><p class="meta">行政書士の入会及び退会</p><div class="src-body">（行政書士の入会及び退会）行政書士は、第六条の二第二項の規定による登録を受けた時に、当然、その事務所の所在地の属する都道府県の区域に設立されている行政書士会の会員となる。
2 行政書士は、他の都道府県の区域内に事務所を移転したときは、その移転があつたときに、当然、従前の行政書士会を退会し、当該都道府県の区域に設立されている行政書士会の会員となる。
3 行政書士は、第七条第一項各号の一に該当するに至つたとき又は同条第二項の規定により登録を抹消されたときは、その時に、当然、その所属する行政書士会を退会する。</div></div>
