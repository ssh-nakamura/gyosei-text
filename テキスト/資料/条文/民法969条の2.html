<h1>民法969条の2</h1><p class="meta">公正証書遺言の方式の特則</p><div class="src-body">（公正証書遺言の方式の特則）口がきけない者が公正証書によって遺言をする場合には、遺言者は、公証人及び証人の前で、遺言の趣旨を通訳人の通訳により申述し、又は自書して、前条第一項第二号の口授に代えなければならない。２公証人は、前項に定める方式に従って公正証書を作ったときは、その旨をその証書に記載し、又は記録しなければならない。</div></div>
