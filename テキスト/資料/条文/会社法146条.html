<h1>会社法146条</h1><p class="meta">株式の質入れ</p><div class="src-body">株主は、その有する株式に質権を設定することができる。
2 株券発行会社の株式の質入れは、当該株式に係る株券を交付しなければ、その効力を生じない。</div><div class="note"><p><b>かみくだくと</b>　株主は自分の株式に質権を設定して資金調達の担保にできる。株券発行会社では株券を質権者に交付しなければ質入れの効力が生じないのに対し、株券を発行しない会社では当事者の合意だけで効力が生じ、株主名簿への記載が対抗要件になる(147条)。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和3年 問38-1</span><span class="hmk x">誤り</span><span class="hnote">解説が根拠として引いている</span></div></details></div>
