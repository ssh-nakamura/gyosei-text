<h1>民法187条</h1><p class="meta">占有の承継</p><div class="src-body">（占有の承継）占有者の承継人は、その選択に従い、自己の占有のみを主張し、又は自己の占有に前の占有者の占有を併せて主張することができる。２前の占有者の占有を併せて主張する場合には、その瑕疵をも承継する。</div><div class="note"><p><b>かみくだくと</b>　占有承継人は自己の占有だけを主張するか前主の占有と併せて主張できますが、併せる場合は前主の占有の瑕疵も承継します。</p></div></div>
