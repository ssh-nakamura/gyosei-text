<h1>民法659条</h1><p class="meta">無報酬の受寄者の注意義務</p><div class="src-body">無報酬の受寄者は、自己の財産に対するのと同一の注意をもって、寄託物を保管する義務を負う。</div><div class="note"><p><b>かみくだくと</b>　無報酬で物を預かった受寄者は、自分の財産に対するのと同じ程度の注意で保管すれば足りる(有償の場合の善管注意義務より軽い)。</p></div><details class="hits"><summary>過去問での出題 2件</summary><div class="hit"><span class="hid">平成30年 問36-5</span><span class="hmk x">誤り</span><span class="hnote"></span></div><div class="hit"><span class="hid">平成30年 問36-オ</span><span class="hmk x">誤り</span><span class="hnote">商人が営業の範囲内で寄託を受けたときは、無報酬でも善良な管理者の注意義務を負う(商法595条)</span></div></details></div>
