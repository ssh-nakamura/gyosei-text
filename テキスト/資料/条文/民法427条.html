<h1>民法427条</h1><p class="meta">分割債権及び分割債務</p><div class="src-body">（分割債権及び分割債務）数人の債権者又は債務者がある場合において、別段の意思表示がないときは、各債権者又は各債務者は、それぞれ等しい割合で権利を有し、又は義務を負う。</div><div class="note"><p><b>かみくだくと</b>　債権者や債務者が数人いる場合、別段の意思表示がなければ各人が等しい割合で権利をもち義務を負うと定める。分割債権・分割債務が原則となることを示す条文。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">平成30年 問36-ウ</span><span class="hmk o">正しい</span><span class="hnote">一人または全員のために商行為となる行為で数人が債務を負担すれば連帯債務となる(商法511条1項)</span></div></details></div>
