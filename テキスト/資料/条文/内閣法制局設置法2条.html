<h1>内閣法制局設置法2条</h1><p class="meta">法制局長官</p><div class="src-body">（法制局長官）内閣法制局の長は、内閣法制局長官とし、内閣が任命する。２長官は、内閣法制局の事務を統括し、部内の職員の任免、進退を行い、且つ、その服務につき、これを統督する。</div><div class="note"><p><b>かみくだくと</b>　内閣法制局の長を内閣法制局長官とし、内閣が任命すると定める。長官は内閣法制局の事務を統括し、部内の職員の任免・進退を行い、かつその服務につきこれを統督する。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和3年 問49-ア</span><span class="hmk x">誤り</span><span class="hnote">内閣法制局長官は内閣が任命し、両議院の同意は要件になっていない(内閣法制局設置法2条1項)</span></div></details></div>
