<h1>民法458条の2</h1><p class="meta">主たる債務の履行状況に関する情報の提供義務</p><div class="src-body">（主たる債務の履行状況に関する情報の提供義務）保証人が主たる債務者の委託を受けて保証をした場合において、保証人の請求があったときは、債権者は、保証人に対し、遅滞なく、主たる債務の元本及び主たる債務に関する利息、違約金、損害賠償その他その債務に従たる全てのものについての不履行の有無並びにこれらの残額及びそのうち弁済期が到来しているものの額に関する情報を提供しなければならない。</div></div>
