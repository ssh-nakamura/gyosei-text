<h1>民法256条</h1><p class="meta">共有物の分割請求</p><div class="src-body">（共有物の分割請求）各共有者は、いつでも共有物の分割を請求することができる。ただし、五年を超えない期間内は分割をしない旨の契約をすることを妨げない。２前項ただし書の契約は、更新することができる。ただし、その期間は、更新の時から五年を超えることができない。</div></div>
