<h1>民法534条</h1><p class="meta">削除</p><div class="src-body">この条文は平成29年(2017年)の民法改正により削除された(令和2年4月1日施行)。
改正前は、特定物に関する物権の設定・移転を目的とする契約において、目的物が債務者の責めに帰することができない事由で滅失した場合、その危険は債権者が負うと定めていた。現在は民法536条1項により、債権者は反対給付の履行を拒むことができる。</div><div class="note"><p><b>かみくだくと</b>　2020年施行の民法改正で削除された条文。改正前は特定物売買の危険を買主が負うとしていたが、現在は536条1項により買主は代金の支払を拒める。改正前の出題を解く際の参照用。</p></div></div>
