<h1>商法538条</h1><p class="meta">利益の配当の制限</p><div class="src-body">出資が損失によって減少したときは、その損失をてん補した後でなければ、匿名組合員は、利益の配当を請求することができない。</div><div class="note"><p><b>かみくだくと</b>　出資が損失によって目減りしているときは、その損失を埋め合わせた後でなければ匿名組合員は利益の配当を請求できない。過去の損失を無視して利益だけ先に取り出すことを防ぎ、営業者の債権者を保護する規定。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和6年 問36-3</span><span class="hmk o">正しい</span><span class="hnote">損失のてん補は配当の時期を後ろにずらすだけで、匿名組合員が出資額を超えて負担する義務はない(商法538条)</span></div></details></div>
