<h1>民法260条</h1><p class="meta">共有物の分割への参加</p><div class="src-body">（共有物の分割への参加）共有物について権利を有する者及び各共有者の債権者は、自己の費用で、分割に参加することができる。２前項の規定による参加の請求があったにもかかわらず、その請求をした者を参加させないで分割をしたときは、その分割は、その請求をした者に対抗することができない。</div></div>
