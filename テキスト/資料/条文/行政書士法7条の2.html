<h1>行政書士法7条の2</h1><p class="meta">行政書士証票の返還</p><div class="src-body">（行政書士証票の返還）行政書士の登録が抹消されたときは、その者、その法定代理人又はその相続人は、遅滞なく、行政書士証票を日本行政書士会連合会に返還しなければならない。行政書士が第十四条の規定により業務の停止の処分を受けた場合においても、また同様とする。
2 日本行政書士会連合会は、前項後段の規定に該当する行政書士が、行政書士の業務を行うことができることとなつたときは、その申請により、行政書士証票をその者に再交付しなければならない。</div></div>
