<h1>民法1004条</h1><p class="meta">遺言書の検認</p><div class="src-body">（遺言書の検認）遺言書の保管者は、相続の開始を知った後、遅滞なく、これを家庭裁判所に提出して、その検認を請求しなければならない。遺言書の保管者がない場合において、相続人が遺言書を発見した後も、同様とする。２前項の規定は、公正証書による遺言については、適用しない。３封印のある遺言書は、家庭裁判所において相続人又はその代理人の立会いがなければ、開封することができない。</div></div>
