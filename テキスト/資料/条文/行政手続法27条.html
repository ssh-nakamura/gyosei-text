<h1>行政手続法27条</h1><p class="meta">審査請求の制限</p><div class="src-body">この節の規定に基づく処分又はその不作為については、審査請求をすることができない。</div><div class="note"><p><b>かみくだくと</b>　聴聞や弁明の機会の付与そのものに関する処分やその不作為については、審査請求ができない。手続の途中の細かい判断にいちいち不服申立てを認めると処分が進まなくなるため、不服があるなら最終的な不利益処分そのものを争え、という趣旨。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和4年 問12-4</span><span class="hmk x">誤り</span><span class="hnote">行政手続法27条により、聴聞の節の規定に基づく処分等については審査請求ができない</span></div></details></div>
