<h1>住民基本台帳法39条</h1><p class="meta">適用除外</p><div class="src-body">（適用除外）この法律は、日本の国籍を有しない者のうち第三十条の四十五の表の上欄に掲げる者以外のものその他政令で定める者については、適用しない。</div><div class="note"><p><b>かみくだくと</b>　30条の45の表に掲げる者以外の日本の国籍を有しない者その他政令で定める者については、この法律を適用しないと定める適用除外の規定。</p></div><details class="hits"><summary>過去問での出題 1件</summary><div class="hit"><span class="hid">令和4年 問26-5</span><span class="hmk x">誤り</span><span class="hnote">中長期在留者や特別永住者などは外国人住民として住民票が作られ、住民登録の対象となる</span></div></details></div>
