<h1>民法235条</h1><div class="src-body">境界線から一メートル未満の距離において他人の宅地を見通すことのできる窓又は縁側（ベランダを含む。次項において同じ。）を設ける者は、目隠しを付けなければならない。２前項の距離は、窓又は縁側の最も隣地に近い点から垂直線によって境界線に至るまでを測定して算出する。</div></div>
