<h1>民法605条</h1><p class="meta">不動産賃貸借の対抗力</p><div class="src-body">不動産の賃貸借は、これを登記したときは、その不動産について物権を取得した者その他の第三者に対抗することができる。</div><div class="note"><p><b>かみくだくと</b>　不動産の賃貸借は、登記をすれば、その後にその不動産の物権を取得した者などの第三者に対しても主張できる。</p></div><details class="hits"><summary>過去問での出題 2件</summary><div class="hit"><span class="hid">令和3年 問35-2</span><span class="hmk x">誤り</span><span class="hnote"></span></div><div class="hit"><span class="hid">令和3年 問35-オ</span><span class="hmk x">誤り</span><span class="hnote">配偶者居住権の設定の登記は所有者が備えさせる義務を負い、共同申請による(民法1031条1項)</span></div></details></div>
