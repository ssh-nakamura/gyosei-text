<h1>行政書士法23条の2</h1><div class="src-body">次の各号のいずれかに該当する場合には、その違反行為をした者は、三十万円以下の罰金に処する。一第十三条の二十の二第六項において準用する会社法第九百五十五条第一項の規定に違反して、同項に規定する調査記録簿等に同項に規定する電子公告調査に関し法務省令で定めるものを記載せず、若しくは記録せず、若しくは虚偽の記載若しくは記録をし、又は当該調査記録簿等を保存しなかつたとき。二第十三条の二十二第一項の規定による当該職員の検査を拒み、妨げ、又は忌避したとき。</div></div>
