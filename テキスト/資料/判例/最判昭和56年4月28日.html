<h1>最判昭和56年4月28日</h1><p class="meta">契約金</p><h2>事案</h2><p>判示事項: 財団法人の設立を目的とする寄附行為と民法九四条一項の規定の類推適用（最高裁判所第三小法廷、事件番号 昭和53(オ)823、民集 第35巻3号696頁）</p><h2>判旨</h2><p>寄附行為の一環としてされた財産出捐行為が、財団法人設立関係者の通謀に基づいてされた虚偽仮装のものであるときは、民法九四条一項の規定を類推適用して該寄附行為を無効とするのが相当である。</p></div>
