<h1>最判平成12年4月21日</h1><p class="meta">譲受債権請求事件</p><h2>事案</h2><p>判示事項: 既発生債権及び将来債権を一括して目的とするいわゆる集合債権の譲渡予約において譲渡の目的となるべき債権の特定があるとされる場合（最高裁判所第二小法廷、事件番号 平成8(オ)1049、民集 第54巻4号1562頁）</p><h2>判旨</h2><p>甲が乙との間の特定の商品の売買取引に基づき乙に対して現に有し又は将来有することのある売掛代金債権を目的として丙との間で譲渡の予約をした場合、譲渡の目的となるべき債権は、甲の有する他の債権から識別ができる程度に特定されているということができる。</p></div>
