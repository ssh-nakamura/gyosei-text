<h1>最判昭和24年10月4日</h1><p class="meta">所有權移轉登記手續請求</p><h2>事案</h2><p>判示事項: 手附契約の解釈（最高裁判所第三小法廷、事件番号 昭和23(オ)119、民集 第3巻10号437頁）</p><h2>判旨</h2><p>売買契約書に「買主本契約ヲ不履行ノ時ハ手附金ハ売主ニ於テ没収シ、返却ノ義務ナキモノトス。売主不履行ノ時ハ買主ヘ既収手附金ヲ返還スルト同時ニ手附金ト同額ヲ違約金トシテ別ニ賠償シ以テ各損害補償ニ供スルモノトス。」という条項があることだけでは、民法第五五七条の適用を排除する意思表示があつたものということはできない。</p></div>
