<h1>最判昭和44年9月12日</h1><p class="meta">所有権確認等請求</p><h2>事案</h2><p>判示事項: 請負契約に基づき建築された建物所有権が原始的に注文者に帰属するとされた事例（最高裁判所第二小法廷、事件番号 昭和44(オ)538、集民 第96号579頁）</p><h2>判旨</h2><p>注文者が、請負契約の履行として、請負人に対し、全工事代金の半額以上を棟上げのときまでに支払い、その後も工事の進行に応じ残代金の支払をして来たような場合には、特段の事情のないかぎり、建築された建物の所有権は、引渡をまつまでもなく、完成と同時に原始的に注文者に帰属するものと解するのが相当である。</p></div>
