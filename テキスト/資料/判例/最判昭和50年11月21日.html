<h1>最判昭和50年11月21日</h1><p class="meta">所有権移転登記抹消登記手続請求</p><h2>事案</h2><p>判示事項: 物上保証人に対する抵当権の実行による競売開始決定が債務者に告知された場合と被担保債権の消滅時効の中断（最高裁判所第二小法廷、事件番号 昭和47(オ)723、民集 第29巻10号1537頁）</p><h2>判旨</h2><p>物上保証人に対する抵当権の実行により、競売裁判所が競売開始決定をし、これを債務者に告知した場合には、被担保債権についての消滅時効は中断する。</p></div>
