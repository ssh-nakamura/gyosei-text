<h1>最判昭和48年7月17日</h1><p class="meta">建物収去土地明渡等請求</p><h2>事案</h2><p>判示事項: 賃借人が賃借建物に附加した部分が滅失した場合と有益費償還請求権（最高裁判所第三小法廷、事件番号 昭和48(オ)128、民集 第27巻7号798頁）</p><h2>判旨</h2><p>賃借人が賃借建物に附加した増・新築部分が、賃貸人に返還される以前に、賃貸人、賃借人いずれの責にも帰すべきでない事由により滅失したときは、特段の事情のないかぎり、右部分に関する有益費償還請求権は消滅する。</p></div>
