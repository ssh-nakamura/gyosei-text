<h1>最判昭和31年5月10日</h1><p class="meta">不動産所有権移転登記抹消登記手続請求</p><h2>事案</h2><p>判示事項: 不動産共有者の一人のみによる登記簿上の所有名義人に対する登記抹消請求の許否（最高裁判所第一小法廷、事件番号 昭和29(オ)4、民集 第10巻5号487頁）</p><h2>判旨</h2><p>不動産共有者の一人はその持分権に基き、単独で当該不動産につき登記簿上所有名義を有する者に対しその登記の抹消を請求することができる。</p></div>
