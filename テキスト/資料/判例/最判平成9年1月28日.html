<h1>最判平成9年1月28日</h1><p class="meta">相続権不存在確認等、所有権移転登記抹消登記手続</p><h2>事案</h2><p>判示事項: 相続に関する不当な利益を目的としない遺言書の破棄隠匿行為と相続欠格事由（最高裁判所第三小法廷、事件番号 平成6(オ)804、民集 第51巻1号184頁）</p><h2>判旨</h2><p>相続人が相続に関する被相続人の遺言書を破棄又は隠匿した場合において、相続人の右行為が相続に関して不当な利益を目的とするものでなかったときは、右相続人は、民法八九一条五号所定の相続欠格者に当たらない。</p></div>
