<h1>最判平成10年3月26日</h1><p class="meta">不当利得返還</p><h2>事案</h2><p>判示事項: 債権について一般債権者の差押えと抵当権者の物上代位権に基づく差押えが競合した場合における両者の優劣の判断基準（最高裁判所第一小法廷、事件番号 平成6(オ)1408、民集 第52巻2号483頁）</p><h2>判旨</h2><p>債権について一般債権者の差押えと抵当権者の物上代位権に基づく差押えが競合した場合には、両者の優劣は、一般債権者の申立てによる差押命令の第三債務者への送達と抵当権設定登記の先後によって決すべきである。</p></div>
