<h1>最判昭和36年7月20日（所有権移転登記手続履行請求）</h1><p class="meta">所有権移転登記手続履行請求</p><h2>事案</h2><p>判示事項: 時効による不動産の所有権取得とその対抗要件。（最高裁判所第一小法廷、事件番号 昭和34(オ)779、民集 第15巻7号1903頁）</p><h2>判旨</h2><p>不動産の取得時効が完成しても、その登記がなければ、その後に所有権取得登記を経由した第三者に対しては時効による権利の取得を対抗しえないが、第三者の右登記後に占有者がなお引続き時効取得に要する期間占有を継続した場合には、その第三者に対し、登記を経由しなくとも時効取得をもつて対抗しうるものと解すべきである。</p></div>
