<h1>最判昭和29年9月24日</h1><p class="meta">室明渡請求</p><h2>事案</h2><p>判示事項: 債権者代位権による建物明渡請求権の行使方法（最高裁判所第二小法廷、事件番号 昭和28(オ)812、民集 第8巻9号1658頁）</p><h2>判旨</h2><p>建物の賃借人が、賃貸人たる建物所有者に代位して、建物の不法占拠者に対しその明渡を請求する場合には、直接自己に対して明渡をなすべきことを請求することができる。</p></div>
