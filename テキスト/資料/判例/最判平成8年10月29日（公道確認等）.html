<h1>最判平成8年10月29日（公道確認等）</h1><p class="meta">公道確認等</p><h2>事案</h2><p>判示事項: 背信的悪意者からの転得者と民法一七七条の第三者（最高裁判所第三小法廷、事件番号 平成5(オ)956、民集 第50巻9号2506頁）</p><h2>判旨</h2><p>所有者甲から乙が不動産を買い受け、その登記が未了の間に、甲から丙が当該不動産を二重に買い受け、更に丙から転得者丁が買い受けて登記を完了した場合に、丙が背信的悪意者に当たるとしても、丁は、乙に対する関係で丁自身が背信的悪意者と評価されるのでない限り、当該不動産の所有権取得をもって乙に対抗することができる。</p></div>
