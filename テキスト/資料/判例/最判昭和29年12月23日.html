<h1>最判昭和29年12月23日</h1><p class="meta">建物収去、土地明渡請求</p><h2>事案</h2><p>判示事項: 土地共有者の一人だけについて民法第三八八条本文の事由が生じた場合と法定地上権の成否（最高裁判所第一小法廷、事件番号 昭和26(オ)285、民集 第8巻12号2235頁）</p><h2>判旨</h2><p>土地共有者の一人だけについて民法第三八八条本文の事由が生じたとしても、これがため他の共有者の意思如何に拘らずそのものの持分までが無視されるべきいわれはなく、当該共有土地については、なんら地上権は発生しない。</p></div>
