<h1>最判平成2年1月22日</h1><p class="meta">建物収去土地明渡</p><h2>事案</h2><p>判示事項: 土地を目的とする一番抵当権設定当時土地と地上建物の所有者が異なつていたが後順位抵当権設定当時同一人の所有に帰していた場合と法定地上権の成否（最高裁判所第二小法廷、事件番号 昭和62(オ)452、民集 第44巻1号314頁）</p><h2>判旨</h2><p>土地を目的とする一番抵当権設定当時土地と地上建物の所有者が異なり、法定地上権成立の要件が充足されていなかつた場合には、土地と建物が同一人の所有に帰した後に後順位抵当権が設定されたとしても、抵当権の実行により一番抵当権が消滅するときは、法定地上権は成立しない。</p></div>
