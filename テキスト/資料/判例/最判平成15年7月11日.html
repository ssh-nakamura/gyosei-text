<h1>最判平成15年7月11日</h1><p class="meta">持分全部移転登記抹消登記手続等請求事件</p><h2>事案</h2><p>判示事項: 不動産の共有者の１人が不実の持分移転登記を了している者に対し同登記の抹消登記手続請求をすることの可否（最高裁判所第二小法廷、事件番号 平成13(受)320、民集 第57巻7号787頁）</p><h2>判旨</h2><p>不動産の共有者の１人は，共有不動産について実体上の権利を有しないのに持分移転登記を了している者に対し，その持分移転登記の抹消登記手続を請求することができる。</p></div>
