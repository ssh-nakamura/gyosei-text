<h1>最判昭和62年7月7日</h1><p class="meta">保証債務履行</p><h2>事案</h2><p>判示事項: 一 民法一一七条二項にいう「過失」と重大な過失 二 無権代理人が民法一一七条一項所定の責任を免れる事由として表見代理の成立を主張することの許否（最高裁判所第三小法廷、事件番号 昭和60(オ)289、民集 第41巻5号1133頁）</p><h2>判旨</h2><p>一 民法一一七条二項にいう「過失」は、重大な過失に限定されるものではない。 二 無権代理人は、民法一一七条一項所定の責任を免れる事由として、表見代理の成立を主張することはできない。</p></div>
