<h1>最判昭和39年2月25日</h1><p class="meta">建物収去、土地明渡請求</p><h2>事案</h2><p>判示事項: 共有物を目的とする貸借契約の解除と民法第五四四第一項の適用の有無。（最高裁判所第三小法廷、事件番号 昭和36(オ)397、民集 第18巻2号329頁）</p><h2>判旨</h2><p>共有物を目的とする貸借契約の解除は、共有者によつてされる場合は、民法第二五二条本文にいう「共有物ノ管理ニ関スル事項」に該当すると解すべきであり、右解除については、民法第五四四条第一項の規定は適用されない。</p></div>
