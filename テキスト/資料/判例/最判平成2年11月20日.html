<h1>最判平成2年11月20日</h1><p class="meta">第三者異議、通行権確認、土地明渡等</p><h2>事案</h2><p>判示事項: 民法二一三条の囲繞地通行権の対象地の特定承継と当該通行権の帰すう（最高裁判所第三小法廷、事件番号 昭和61(オ)181、民集 第44巻8号1037頁）</p><h2>判旨</h2><p>民法二一三条の規定する囲繞地通行権は、通行の対象となる土地に特定承継が生じた場合にも消滅しない。</p></div>
