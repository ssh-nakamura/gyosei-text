<h1>最判昭和48年6月28日</h1><p class="meta">第三者異議</p><h2>事案</h2><p>判示事項: 未登記建物の所有者においてその建物が固定資産課税台帳上他人の所有名義で登録されていることを承認していた場合と民法九四条二項の類推適用（最高裁判所第一小法廷、事件番号 昭和47(オ)1164、民集 第27巻6号724頁）</p><h2>判旨</h2><p>未登記建物の所有者は、その建物が固定資産課税台帳上他人の所有名義で登録されていることを知りながら、これを明示または黙示に承認していた場合には、民法九四条二項の類推適用により、右名義人が所有権を有しないことを善意の第三者に対抗することができない。</p></div>
