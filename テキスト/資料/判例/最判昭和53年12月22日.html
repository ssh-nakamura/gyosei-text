<h1>最判昭和53年12月22日</h1><p class="meta">取立債権</p><h2>事案</h2><p>判示事項: 土地賃借権の移転と敷金に関する敷金交付者の権利義務関係の承継の有無（最高裁判所第二小法廷、事件番号 昭和52(オ)844、民集 第32巻9号1768頁）</p><h2>判旨</h2><p>土地賃借権が賃貸人の承諾を得て旧賃借人から新賃借人に移転された場・合であつても、敷金に関する敷金交付者の権利義務関係は、敷金交付者において賃貸人との間で敷金をもつて新賃借人の債務の担保とすることを約し又は新賃借人に対して敷金返還請求権を譲渡するなど特段の事情のない限り、新賃借人に承継されない。</p></div>
