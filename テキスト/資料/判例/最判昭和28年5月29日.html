<h1>最判昭和28年5月29日</h1><p class="meta">預金払戻請求</p><h2>事案</h2><p>判示事項: 特定の債権譲渡に対し債務者が事前に同意を与えた場合と民法第四六七条第一項の対抗要件の要否（最高裁判所第二小法廷、事件番号 昭和26(オ)682、民集 第7巻5号608頁）</p><h2>判旨</h2><p>債権者が特定の債権を特定の譲受人に譲渡しようとするにあたり、債務者が予めその譲渡行為に同意を与えたときは、右譲渡の後あらためて民法第四六七条第一項所定の通知または承諾がなくても、当該債務者に対しては、右債権譲渡を対抗し得ると解するのが相当である。</p></div>
