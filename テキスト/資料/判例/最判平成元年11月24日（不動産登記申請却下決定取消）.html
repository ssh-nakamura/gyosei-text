<h1>最判平成元年11月24日（不動産登記申請却下決定取消）</h1><p class="meta">不動産登記申請却下決定取消</p><h2>事案</h2><p>判示事項: 共有者の一人が相続人なくして死亡したときとその持分の帰すう（最高裁判所第二小法廷、事件番号 昭和63(行ツ)40、民集 第43巻10号1220頁）</p><h2>判旨</h2><p>共有者の一人が死亡し、相続人の不存在が確定し、相続債権者や受遺者に対する清算手続が終了したときは、その持分は、民法九五八条の三に基づく特別縁故者に対する財産分与の対象となり、右財産分与がされないときに、同法二五五条により他の共有者に帰属する。 (反対意見がある。)</p></div>
