<h1>最判平成9年7月3日</h1><p class="meta">建物明渡等</p><h2>事案</h2><p>判示事項: 留置権者が留置物の使用等の承諾を受けた後に留置物の所有権を取得した者による留置物の使用等を理由とする留置権の消滅請求の可否（最高裁判所第一小法廷、事件番号 平成6(オ)1279、民集 第51巻6号2500頁）</p><h2>判旨</h2><p>留置物の所有権が譲渡等により第三者に移転した場合において、右につき対抗要件を具備するよりも前に留置権者が留置物の使用又は賃貸についての承諾を受けていたときは、新所有者は、留置権者に対し、右使用等を理由に留置権の消滅請求をすることはできない。</p></div>
