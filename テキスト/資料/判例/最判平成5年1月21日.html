<h1>最判平成5年1月21日</h1><p class="meta">貸金</p><h2>事案</h2><p>判示事項: 無権代理人が本人を共同相続した場合における無権代理行為の効力（最高裁判所第一小法廷、事件番号 昭和63(オ)1733、民集 第47巻1号265頁）</p><h2>判旨</h2><p>無権代理人が本人を共同相続した場合には、共同相続人全員が共同して無権代理行為を追認しない限り、無権代理人の相続分に相当する部分においても、無権代理行為が当然に有効となるものではない。（反対意見がある。）</p></div>
