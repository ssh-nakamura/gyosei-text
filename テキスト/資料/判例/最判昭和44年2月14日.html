<h1>最判昭和44年2月14日</h1><p class="meta">建物収去土地明渡請求</p><h2>事案</h2><p>判示事項: 抵当権設定当時土地および建物の所有者が異なるがその抵当権の実行による競落の際これが同一人の所有に帰していた場合と民法三八八条の適用（最高裁判所第二小法廷、事件番号 昭和43(オ)846、民集 第23巻2号357頁）</p><h2>判旨</h2><p>抵当権設定当時土地および建物の所有者が異なる場合においては、その土地または建物に対する抵当権の実行による競落の際、右土地およぴ建物が同一人の所有に帰していても、民法三八八条の規定は適用または準用されない。</p></div>
