<h1>最判昭和33年10月14日</h1><p class="meta">家屋収去土地明渡請求</p><h2>事案</h2><p>判示事項: 被相続人の不動産の譲渡と民法第一七七条の第三者。（最高裁判所第三小法廷、事件番号 昭和31(オ)1023、民集 第12巻14号3111頁）</p><h2>判旨</h2><p>被相続人が不動産の譲渡をなした場合、その相続人から同一不動産の譲渡を受けた者は、民法第一七七条にいう第三者に該当するものと解すべきである。</p></div>
