<h1>最判昭和46年11月19日</h1><p class="meta">売掛代金請求</p><h2>事案</h2><p>判示事項: 金銭の支払を求める詐害行為取消訴訟手続において被告は自己の債権額に対応する按分額の支払を拒むことができるか（最高裁判所第二小法廷、事件番号 昭和45(オ)498、民集 第25巻8号1321頁）</p><h2>判旨</h2><p>債権者が、受益者を被告として、債務者の受益者に対する弁済行為を取り消し、かつ、右取消にかかる弁済額の支払を求める詐害行為取消訴訟手続において、被告は、右弁済額を原告の債権額と自己の債権額とで按分し、後者に対応する按分額につき、支払を拒むことはできない。</p></div>
