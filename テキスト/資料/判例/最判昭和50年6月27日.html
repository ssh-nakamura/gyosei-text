<h1>最判昭和50年6月27日</h1><p class="meta">根抵当権設定登記抹消登記手続等請求</p><h2>事案</h2><p>判示事項: 準禁治産者が取消の対象である金銭消費貸借契約によつて得た利益を賭博に浪費した場合と返還義務（最高裁判所第二小法廷、事件番号 昭和49(オ)1019、集民 第115号153頁）</p><h2>判旨</h2><p>準禁治産者が取消の対象である金銭消費貸借契約によつて得た利益を賭博に浪費し、右利益が現存しない場合には、その返還義務を負わない。</p></div>
