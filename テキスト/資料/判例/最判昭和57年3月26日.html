<h1>最判昭和57年3月26日</h1><p class="meta">離婚無効確認</p><h2>事案</h2><p>判示事項: いわゆる方便としてされた協議離婚が有効とされた事例（最高裁判所第二小法廷、事件番号 昭和56(オ)1197、集民 第135号449頁）</p><h2>判旨</h2><p>夫婦が事実上の婚姻関係を継続しつつ、単に生活扶助を受けるための方便として協議離婚の届出をした場合でも、右届出が真に法律上の婚姻関係を解消する意思の合致に基づいてされたものであるときは、右協議離婚は無効とはいえない。</p></div>
