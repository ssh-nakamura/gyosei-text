<h1>最判平成17年2月22日</h1><p class="meta">売掛代金請求及び独立当事者参加事件</p><h2>事案</h2><p>判示事項: 動産売買の先取特権者による物上代位権の行使と目的債権の譲渡（最高裁判所第三小法廷、事件番号 平成16(受)1271、民集 第59巻2号314頁）</p><h2>判旨</h2><p>動産売買の先取特権者は，物上代位の目的債権が譲渡され，第三者に対する対抗要件が備えられた後においては，目的債権を差し押さえて物上代位権を行使することはできない。</p></div>
