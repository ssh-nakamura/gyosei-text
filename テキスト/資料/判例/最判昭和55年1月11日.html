<h1>最判昭和55年1月11日</h1><p class="meta">譲受債権</p><h2>事案</h2><p>判示事項: 指名債権が二重に譲渡され確定日付のある各譲渡通知が同時に債務者に到達した場合における譲受人の一人からする弁済請求（最高裁判所第三小法廷、事件番号 昭和53(オ)1199、民集 第34巻1号42頁）</p><h2>判旨</h2><p>指名債権が二重に譲渡され、確定日付のある各譲渡通知が同時に債務者に到達したときは、各譲受人は、債務者に対しそれぞれの譲受債権全額の弁済を請求することができ、譲受人の一人から弁済の請求を受けた債務者は、他の譲受人に対する弁済その他の債務消滅事由が存在しない限り、弁済の責を免れることができない。</p></div>
