<h1>最判昭和48年10月9日</h1><p class="meta">売掛金等請求</p><h2>事案</h2><p>判示事項: 権利能力のない社団の取引上の債務と社団構成員の責任（最高裁判所第三小法廷、事件番号 昭和45(オ)1038、民集 第27巻9号1129頁）</p><h2>判旨</h2><p>権利能力のない社団の代表者が社団の名においてした取引上の債務は、社団の構成員全員に一個の義務として総有的に帰属し、社団の総有財産だけがその責任財産となり、構成員各自は、取引の相手方に対し個人的債務ないし責任を負わない。</p></div>
